# Build each app's aarch64 image and push it to GHCR, tagged with the version in
# its config.yaml (the Supervisor pulls image:version). A version that is
# already published is left alone, so bump the version to ship a change.
name: Build app images

on:
  push:
    branches: [main]
    paths:
      - "airplay_video/**"
      - "hdmi_cec/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [airplay_video, hdmi_cec]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: info
        run: |
          version="$(yq -r '.version' "${{ matrix.app }}/config.yaml")"
          image="ghcr.io/${{ github.repository_owner }}/aarch64-${{ matrix.app }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image:$version" > /dev/null 2>&1; then
            echo "$image:$version is already published"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.info.outputs.published != 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.info.outputs.published != 'true'

      - uses: docker/build-push-action@v6
        if: steps.info.outputs.published != 'true'
        with:
          context: ${{ matrix.app }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.info.outputs.image }}:${{ steps.info.outputs.version }}
            ${{ steps.info.outputs.image }}:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=aarch64
            io.hass.version=${{ steps.info.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
